<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>NEXA | Cadastro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a66c2, #0f2a44);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            /*deu certo?*/
        }

        .register-container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo h1 {
            color: #0a66c2;
            font-size: 32px;
            letter-spacing: 2px;
        }

        .logo p {
            font-size: 14px;
            color: #666;
        }

        form label {
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin-top: 12px;
        }

        form input,
        form select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
        }

        form input:focus,
        form select:focus {
            border-color: #0a66c2;
        }

        .button2 {
            width: 100%;
            margin-top: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            padding: 0.75em 1.7em;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            border-radius: 0.6em;
            background: #0a66c2;
            border: 1px solid #0a66c2;
        }

        .success,
        .error {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .links {
            margin-top: 15px;
            text-align: center;
        }

        .links a {
            text-decoration: none;
            font-size: 14px;
            color: #0a66c2;
            display: block;
            margin-top: 8px;
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        #campoEmpresa {
            display: none;
        }

       
    </style>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="body_login">

    <div class="register-container">

        <div class="logo">
            <h1>NEXA</h1>
            <p>Segurança no centro</p>
        </div>

        <form id="registerForm">

            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Nome do usuário">

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00">

            <label for="nascimento">Data de nascimento</label>
            <input type="date" id="nascimento">

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="usuario@empresa.com">

            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" placeholder="(00) 00000-0000">

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Mínimo 6 caracteres">

            <label for="confirmar">Confirmar senha</label>
            <input type="password" id="confirmar" placeholder="Repita a senha">

            <label for="tipo">Tipo de usuário</label>
            <select id="tipo">
                <option value="">Selecione</option>
                <option value="admin">Administrador</option>
                <option value="funcionario">Funcionário</option>
            </select>

            <div id="campoEmpresa">

                <label for="codigo_empresa">Código da empresa</label>
                <input type="text" id="codigo_empresa">

            </div>

            <button type="submit" class="button2">Cadastrar</button>

        </form>

        <div class="success" id="successMsg">
            Cadastro realizado com sucesso!
        </div>

        <div class="error" id="errorMsg">
            As senhas não conferem.
        </div>

        <div id="errorCampo" class="error">
            Verifique se os campos estão preenchidos.
        </div>

        <div class="links">
            <a href="login.html">Voltar para o login</a>
        </div>

        <footer class="footerweb">
            © 2026 – NEXA
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/register.js"></script>

</body>

</html>
