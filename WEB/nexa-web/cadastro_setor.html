<script>
let setores = [];

function renderizar(){
    const lista = document.getElementById('lista');

    if(setores.length === 0){
        lista.innerHTML = `<p id="mensagemVazia">Nenhum setor cadastrado :(</p>`;
        return;
    }

    lista.innerHTML = '';

    setores.forEach((setor,index)=>{
        lista.innerHTML += `
        <div class="lista-card">
            <div class="lista-left">
                <i class="fas fa-building"></i>
                <div class="lista-info">
                    <h3>${setor.nome}</h3>
                    <p>Local: ${setor.local}</p>
                    <p>CNPJ: ${setor.cnpj}</p>
                </div>
            </div>
            <div class="lista-actions">
                <i class="fas fa-pen edit" onclick="editar(${index})"></i>
                <i class="fas fa-trash delete" onclick="excluir(${index})"></i>
            </div>
        </div>`;
    });
}

function cadastrar(){
    const nome = document.getElementById('nome');
    const local = document.getElementById('local');
    const cnpj = document.getElementById('cnpj');

    let ok = true;

    [nome, local, cnpj].forEach(clearError);

    if(!validarObrigatorio(nome)) ok = false;
    if(!validarObrigatorio(local)) ok = false;

    if(!validarObrigatorio(cnpj)){
        ok = false;
    } else if(!validarCNPJ(cnpj.value)){
        setError(cnpj, "CNPJ inválido");
        ok = false;
    }

    if(!ok) return;

    setores.push({
        nome: nome.value,
        local: local.value,
        cnpj: cnpj.value
    });

    renderizar();

    nome.value = '';
    local.value = '';
    cnpj.value = '';
}
function editar(index){
    editIndex = index;

    document.getElementById('editNome').value = setores[index].nome;
    document.getElementById('editLocal').value = setores[index].local;
    document.getElementById('editCnpj').value = setores[index].cnpj;

    document.getElementById('modalBg').style.display = 'flex';
}
function excluir(index){
    const setor = setores[index];

    Swal.fire({
        title: "Tem certeza que deseja excluir o bloco?",
        icon: "warning",
        html: `
            <b>Nome:</b> ${setor.nome}<br>
            <b>Local:</b> ${setor.local}
        `,
        showCloseButton: true,
        showCancelButton: true,
        focusConfirm: false,
        confirmButtonText: `
            <i class="fa fa-thumbs-up"></i> Sim!
        `,
        confirmButtonAriaLabel: "Sim",
        cancelButtonText: `
            <i class="fa fa-thumbs-down"></i>
        `,
        cancelButtonAriaLabel: "Não"
    }).then((result) => {

        if (result.isConfirmed) {
            setores.splice(index,1);
            renderizar();
        }
    });
}

function logout(){
    alert("Saindo...");
    window.location.href = "login_adm.html";
}

let editIndex = null;

function fecharModal(){
    document.getElementById('modalBg').style.display = 'none';
}
function salvarEdicao(){
    const nome = document.getElementById('editNome');
    const local = document.getElementById('editLocal');
    const cnpj = document.getElementById('editCnpj');

    let ok = true;

    [nome, local, cnpj].forEach(clearError);

    if(!validarObrigatorio(nome)) ok = false;
    if(!validarObrigatorio(local)) ok = false;

    if(!validarObrigatorio(cnpj)){
        ok = false;
    } else if(!validarCNPJ(cnpj.value)){
        setError(cnpj, "CNPJ inválido");
        ok = false;
    }

    if(!ok) return;

    setores[editIndex] = {
        nome: nome.value,
        local: local.value,
        cnpj: cnpj.value
    };

    renderizar();
    fecharModal();
}

function validarObrigatorio(input, msg = "Campo obrigatório"){
    if(!input.value || !input.value.trim()){
        setError(input, msg);
        return false;
    }
    return true;
}
function setError(input, msg){
    const group = input.closest(".form-group");
    if(!group) return;

    const box = group.querySelector(".input-box");
    const erro = group.querySelector(".error-text");

    if(box) box.classList.add("error");
    if(erro) erro.innerText = msg;
}

function clearError(input){
    const group = input.closest(".form-group");
    if(!group) return;

    const box = group.querySelector(".input-box");
    const erro = group.querySelector(".error-text");

    if(box) box.classList.remove("error");
    if(erro) erro.innerText = "";
}


function maskCNPJ(input){
    let v = input.value.replace(/\D/g,"").slice(0,14);

    v = v.replace(/^(\d{2})(\d)/,"$1.$2");
    v = v.replace(/^(\d{2})\.(\d{3})(\d)/,"$1.$2.$3");
    v = v.replace(/\.(\d{3})(\d)/,".$1/$2");
    v = v.replace(/(\d{4})(\d)/,"$1-$2");

    input.value = v;
}

function validarCNPJ(cnpj){
    cnpj = cnpj.replace(/[^\d]+/g,'');

    if(cnpj.length !== 14) return false;
    if(/^(\d)\1+$/.test(cnpj)) return false;

    let tamanho = cnpj.length - 2;
    let numeros = cnpj.substring(0,tamanho);
    let digitos = cnpj.substring(tamanho);

    let soma = 0;
    let pos = tamanho - 7;

    for(let i=tamanho;i>=1;i--){
        soma += numeros.charAt(tamanho-i) * pos--;
        if(pos<2) pos = 9;
    }

    let resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;
    if(resultado != digitos.charAt(0)) return false;

    tamanho++;
    numeros = cnpj.substring(0,tamanho);

    soma = 0;
    pos = tamanho - 7;

    for(let i=tamanho;i>=1;i--){
        soma += numeros.charAt(tamanho-i) * pos--;
        if(pos<2) pos = 9;
    }

    resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;

    return resultado == digitos.charAt(1);
}
