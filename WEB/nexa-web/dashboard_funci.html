<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>NEXA | Dashboard</title>
<link rel="stylesheet" href="assets/css/style_funci.css">

    <!-- ICONES -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/acessibilidade.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

      body{
    display:flex;
    min-height:100vh;
    background:url('https://img.freepik.com/photos-premium/pour-securite-operation-travail-ingenieur-deux-ouvriers-du-batiment-tiennent-respectivement-casque-securite-jaune-blanc-the-generative-ai_28914-25222.jpg') no-repeat center/cover;
}


        /* ===== SIDEBAR ===== */
     .sidebar {
    width: 260px;
    background: #0f2a44;
    color: #fff;

    position: fixed;
    top: 0;
    left: 0;

    height: 100vh;
    display: flex;
    flex-direction: column;

    overflow-y: auto; /* caso o menu cresça */
}

        .sidebar-top {
            position: relative;
            height: 160px;
            background: url('assets/images/slide1.jpg') center/cover;
            display: flex;
            align-items: flex-end;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .sidebar-top::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(15,42,68,0.95));
        }

        .sidebar-top span {
            position: relative;
            z-index: 1;
        }

        .menu {
            display: flex;
            flex-direction: column;
        }

        .menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            color: #cbd5e1;
            text-decoration: none;
            transition: .2s;
        }

        .menu a:hover {
            background: #0a66c2;
            color: #fff;
        }

                    /* LOGOUT IGUAL MENU */
            .logout-item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px 10px;
                margin: 10px;
                border-radius: 8px;
                color: #cbd5e1;
                text-decoration: none;
                transition: .2s;
                border-top: 1px solid rgba(255,255,255,.1);
                 margin-top: auto;
            }

            /* HOVER */
            .logout-item:hover {
                background: #0a66c2;
                color: #fff;
            }

        .logout {
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,.1);
        }

        /* ===== MAIN ===== */
  .main {
    padding: 10px 0; /* 👈 tira padding lateral */
    padding-top: 60px;

    margin-left: 0; /* 👈 REMOVE o deslocamento duplicado */
}

        header h1 {
            color: #ffffff;
            margin-bottom: 10px;
        }

        /* ===== MENU ACESSIBILIDADE (NOVO) ===== */
 

        /* ===== GRID ===== */
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }

        /* ===== CALENDÁRIO ===== */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .dias {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .dia {
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            position: relative;
        }

        .status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
        }

        .verde { background: #4caf50; }
        .vermelho { background: #f44336; }
        .cinza { background: #9e9e9e; }

        .legend {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        /* ===== DICAS ===== */
        .card.dicas {
            background: linear-gradient(135deg, #ffffff, #f8fafc);
            border-left: 5px solid #0a66c2;
        }

        .card.dicas ul {
            list-style: none;
        }

        .card.dicas li {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 10px;
            background: #fff;
            border-radius: 10px;
        }

        .card.dicas li i {
            color: #0a66c2;
        }
        .card.dicas h3{
            color: #0a66c2;
        }
    </style>
</head>

<body>


    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div>
            <div class="sidebar-top">
                <span>NEXA</span>
            </div>

            <nav class="menu">
                <a href="dashboard_funci.html"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="#"><i class="fas fa-camera"></i> Análise EPI</a>
                <a href="profile.html"><i class="fas fa-user"></i> Perfil</a>
            </nav>
        </div>

        <a href="index.html" class="logout-item" onclick="logout()">
    <i class="fas fa-sign-out-alt"></i> Sair
</a>
    </aside>
    
    <div class="overlay">

    <!-- MAIN -->
    <div class="main">
        

        <!-- 🔹 MENU ACESSIBILIDADE -->
      <div class="access-bar">

    <button class="access-btn" onclick="Acessibilidade.toggleContraste()">
            <i class="fas fa-adjust"></i>
        </button>

     <button class="access-btn" onclick="toggleDark()">
            <i class="fas fa-moon"></i>
        </button>

            <button class="access-btn" onclick="Acessibilidade.aumentarFonte()">A+</button>


    <button class="access-btn" onclick="Acessibilidade.diminuirFonte()">
         A-
    </button>

    <button class="access-btn" onclick="Acessibilidade.lerPagina()">
        <i class="fas fa-volume-up"></i>
    </button>

</div>



        <header>
            <h1>Dashboard</h1>
        </header>

        <div class="grid">

            <!-- CALENDÁRIO -->
            <div class="card">
                <div class="calendar-header">
                    <button onclick="mudarMes(-1)">◀</button>
                    <div>
                        <strong id="mesAno"></strong><br>
                        <small id="ano"></small>
                    </div>
                    <button onclick="mudarMes(1)">▶</button>
                </div>

                <div class="dias" id="dias"></div>

                <div class="legend">
                    <span><span class="dot verde"></span> Correto</span>
                    <span><span class="dot vermelho"></span> Erro</span>
                    <span><span class="dot cinza"></span> Folga</span>
                </div>
            </div>

            <!-- DICAS -->
            <div class="card dicas">
                <h3><i class="fa-solid fa-shield-halved"></i> Dicas de Segurança</h3>
                <ul>
                    <li><i class="fa-solid fa-helmet-safety"></i> Use sempre EPIs completos</li>
                    <li><i class="fa-solid fa-circle-check"></i> Verifique seus equipamentos</li>
                    <li><i class="fa-solid fa-triangle-exclamation"></i> Atenção às áreas de risco</li>
                    <li><i class="fa-solid fa-file-shield"></i> Siga as normas da empresa</li>
                </ul>
            </div>

        </div>

    </div>

    <script>
        const meses = ["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];
        let dataAtual = new Date();

        function renderCalendario() {
            const diasContainer = document.getElementById("dias");
            diasContainer.innerHTML = "";

            const ano = dataAtual.getFullYear();
            const mes = dataAtual.getMonth();

            document.getElementById("mesAno").innerText = meses[mes];
            document.getElementById("ano").innerText = ano;

            const primeiroDia = new Date(ano, mes, 1).getDay();
            const totalDias = new Date(ano, mes + 1, 0).getDate();

            for (let i = 0; i < primeiroDia; i++) {
                diasContainer.innerHTML += "<div></div>";
            }

            for (let dia = 1; dia <= totalDias; dia++) {
                const div = document.createElement("div");
                    div.classList.add("dia");
                    div.innerText = dia;

                    /* 🔥 SIMULA STATUS (exemplo) */
                    const status = document.createElement("div");
                    status.classList.add("status");

                    /* exemplo aleatório */
                    const tipos = ["verde", "vermelho", "cinza"];
                    const tipo = tipos[Math.floor(Math.random() * 3)];
                    status.classList.add(tipo);

                    div.appendChild(status);
                    diasContainer.appendChild(div);
                                }
                            }

        function mudarMes(v) {
            dataAtual.setMonth(dataAtual.getMonth() + v);
            renderCalendario();
        }

        renderCalendario();
    </script>

    <script src="assets/js/acessibilidade.js"></script>

</body>
</html>
