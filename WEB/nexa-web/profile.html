<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>NEXA | Perfil</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/acessibilidade.css">
<link rel="stylesheet" href="assets/css/style_funci.css">


<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

/* ===== BODY ===== */
body {
    display: flex;
     
    min-height: 100vh;
    background: url('https://img.freepik.com/photos-premium/pour-securite-operation-travail-ingenieur-deux-ouvriers-du-batiment-tiennent-respectivement-casque-securite-jaune-blanc-the-generative-ai_28914-25222.jpg')
                no-repeat center center/cover;

}

        /* ===== SIDEBAR ===== */
    .sidebar {
    width: 260px;
    background: #0f2a44;
    color: #fff;

    position: fixed;
    top: 0;
    left: 0;

    height: 100vh;
    display: flex;
    flex-direction: column;

    overflow-y: auto; /* caso o menu cresça */
}


        .sidebar-top {
            position: relative;
            height: 160px;
            background: url('assets/images/slide1.jpg') center/cover;
            display: flex;
            align-items: flex-end;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .sidebar-top::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(15,42,68,0.95));
        }

        .sidebar-top span {
            position: relative;
            z-index: 1;
        }

        .menu {
            display: flex;
            flex-direction: column;
        }

        .menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            color: #cbd5e1;
            text-decoration: none;
            transition: .2s;
        }

        .menu a:hover {
            background: #0a66c2;
            color: #fff;
        }

                    /* LOGOUT IGUAL MENU */
            .logout-item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px 10px;
                margin: 10px;
                border-radius: 8px;
                color: #cbd5e1;
                text-decoration: none;
                transition: .2s;
                border-top: 1px solid rgba(255,255,255,.1);
                 margin-top: auto;
            }

            /* HOVER */
            .logout-item:hover {
                background: #0a66c2;
                color: #fff;
            }

        .logout {
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,.1);
        }


/* ===== MAIN ===== */
.main {
    flex: 1;
    padding: 10px;
    padding-top: 0px;

}

/* ===== ACESSIBILIDADE ===== */

/* ===== CARD ===== */
.card{
    width:950px;
    background:#fff;
    border-radius:25px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.card h1{
    text-align:center;
    margin-bottom:25px;
    color:#0a66c2;
}

.subtitle{
    color:#1565c0;
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

/* GRID */
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.access-bar{
    position: static;
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-bottom:20px;
}

.error-text{
    font-size:13px;
    color:#e53935;
    margin-top:5px;
    padding-left:5px;
}

.input-group{
    display:flex;
    flex-direction:column;
}
.input-box{
    background:#f2f2f2;
    border-radius:15px;
    display:flex;
    align-items:center;
    padding:15px;
}

.input-box i{
    color:#1565c0;
    margin-right:10px;
}

.input-box input{
    border:none;
    background:transparent;
    outline:none;
    width:100%;
}
.input-box.error {
    border: 2px solid #e53935;
    box-shadow: 0 0 6px rgba(229, 57, 53, 0.3);
}
.full{
    grid-column:span 2;
}

/* BOTÕES */
.btn{
    margin-top:25px;
    width:260px;
    height:55px;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    display:block;
    margin-left:auto;
    margin-right:auto;
}

.editar{
    background:#1565c0;
    color:#fff;
}

.salvar{
    display:none;
    background:#28a745;
    color:#fff;
}

/* botão menor */
.btn-small{
    width:150px;
    height:38px;
    font-size:14px;
    border-radius:20px;
}

/* DARK MODE */
.dark{
    background:#0f172a !important;
    color:#fff;
}

.dark .card{
    background:#1e293b;
    color:#fff;
}

.dark .input-box{
    background:#334155;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">

    <div class="sidebar-top">
        <span>NEXA</span>
    </div>

    <nav class="menu">
        <a href="dashboard_funci.html"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="upload.html"><i class="fas fa-camera"></i> Análise EPI</a>
        <a href="profile.html"><i class="fas fa-user"></i> Perfil</a>
    </nav>

    <a href="#" class="logout-item" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i> Sair
    </a>

</aside>
<div class="overlay">
<!-- MAIN -->
<div class="main">

    <!-- ACESSIBILIDADE -->
    <div class="access-bar">
        <button class="access-btn" onclick="Acessibilidade.toggleContraste()">
            <i class="fas fa-adjust"></i>
        </button>

        <button class="access-btn" onclick="toggleDark()">
            <i class="fas fa-moon"></i>
        </button>

        <button class="access-btn" onclick="Acessibilidade.aumentarFonte()">A+</button>
        <button class="access-btn" onclick="Acessibilidade.diminuirFonte()">A-</button>
        <button class="access-btn" onclick="Acessibilidade.lerPagina()">
            <i class="fas fa-volume-up"></i>
        </button>
    </div>

    <!-- CARD -->
    <div class="card">

        <h1>Perfil do Funcionário</h1>

        <div class="subtitle">Informações pessoais</div>

        <div class="form-grid">

            <div class="input-box full">
                <i class="fas fa-user"></i>
                <input type="text" value="Nome do Funcionário" disabled>
            </div>

            <div class="input-box">
                <i class="fas fa-envelope"></i>
                <input id="email" type="email" value="email@nexa.com" disabled>
            </div>

            <div class="input-box">
                <i class="fas fa-phone"></i>
            <input id="telefone" type="text" placeholder="(00) 00000-0000" maxlength="15" oninput="mascaraTelefone(this)">
            </div>

            <div class="input-box">
                <i class="fas fa-calendar"></i>
                <input type="date" value="2000-01-01" disabled>
            </div>

            <div class="input-box">
                <i class="fas fa-id-badge"></i>
                <input type="text" value="UID RFID 123456" disabled>
            </div>

            <div class="input-box full">
                <i class="fas fa-hard-hat"></i>
                <input type="text" value="Capacete, Luvas, Óculos" disabled>
            </div>

        </div>

    <div class="subtitle" style="margin-top:25px;">Segurança</div>

<div class="form-grid">

    
    <div class="input-box input-group">
        <div style="display:flex; align-items:center;">
            <i class="fas fa-lock"></i>
            <input id="senhaAtual" type="password" placeholder="Senha atual">
        </div>
        <div class="error-text" id="erroAtual"></div>
    </div>

    <div class="input-box input-group" id="novaSenhaBox" style="display:none;">
        <div style="display:flex; align-items:center;">
            <i class="fas fa-key"></i>
            <input id="novaSenha" type="password" placeholder="Nova senha (mín. 8 caracteres)">
        </div>
        <div class="error-text" id="erroNova"></div>
    </div>

    <div class="input-box input-group" id="confirmarSenhaBox" style="display:none;">
        <div style="display:flex; align-items:center;">
            <i class="fas fa-key"></i>
            <input id="confirmarSenha" type="password" placeholder="Confirmar senha">
        </div>
        <div class="error-text" id="erroConfirmar"></div>
    </div>

</div>

        <button class="btn editar btn-small" onclick="editar()">
            <i class="fas fa-edit"></i> Editar
        </button>

        <button class="btn salvar" onclick="salvar()">
            <i class="fas fa-save"></i> Salvar
        </button>

    </div>

</div>
<script>
function editar(){

    document.getElementById("telefone").disabled = false;
    document.getElementById("senhaAtual").disabled = false;

    document.getElementById("novaSenhaBox").style.display = "block";
    document.getElementById("confirmarSenhaBox").style.display = "block";

    document.querySelector(".editar").style.display="none";
    document.querySelector(".salvar").style.display="block";
}

function salvar(){

    let ok = true;

    const nova = document.getElementById("novaSenha");
    const confirmar = document.getElementById("confirmarSenha");

    limparErros();

    if(nova.value !== "" || confirmar.value !== ""){

        if(nova.value.length < 8){
            document.getElementById("erroNova").innerText = "A senha deve ter no mínimo 8 caracteres";
            ok = false;
        }

        if(nova.value !== confirmar.value){
            document.getElementById("erroConfirmar").innerText = "As senhas não coincidem";
            ok = false;
        }
    }

    if(!ok) return;

    document.getElementById("telefone").disabled = true;
    document.getElementById("senhaAtual").disabled = true;

    document.getElementById("novaSenhaBox").style.display = "none";
    document.getElementById("confirmarSenhaBox").style.display = "none";

    document.querySelector(".editar").style.display="block";
    document.querySelector(".salvar").style.display="none";

    alert("Dados atualizados com sucesso!");
}

function limparErros(){
    document.getElementById("erroNova").innerText = "";
    document.getElementById("erroConfirmar").innerText = "";
}

/* MÁSCARA TELEFONE */
function mascaraTelefone(input){
    let v = input.value.replace(/\D/g, "");

    if(v.length <= 10){
        v = v.replace(/(\d{2})(\d)/, "($1) $2");
        v = v.replace(/(\d{4})(\d)/, "$1-$2");
    } else {
        v = v.replace(/(\d{2})(\d)/, "($1) $2");
        v = v.replace(/(\d{5})(\d)/, "$1-$2");
    }

    input.value = v;
}

function logout(){
    localStorage.removeItem("tipoUsuario");
    window.location.href="index.html";
}


   function salvar(){

    let ok = true;

    const nova = document.getElementById("novaSenha");
    const confirmar = document.getElementById("confirmarSenha");

    limparErros();

    const novaBox = document.getElementById("novaSenhaBox");
    const confirmarBox = document.getElementById("confirmarSenhaBox");

    if(nova.value !== "" || confirmar.value !== ""){

        if(nova.value.length < 8){
            document.getElementById("erroNova").innerText = "A senha deve ter no mínimo 8 caracteres";
            novaBox.classList.add("error");
            ok = false;
        }

        if(nova.value !== confirmar.value){
            document.getElementById("erroConfirmar").innerText = "As senhas não coincidem";
            confirmarBox.classList.add("error");
            ok = false;
        }
    }

    if(!ok) return;

    // limpa bordas de erro
    novaBox.classList.remove("error");
    confirmarBox.classList.remove("error");

    document.getElementById("telefone").disabled = true;
    document.getElementById("senhaAtual").disabled = true;

    document.getElementById("novaSenhaBox").style.display = "none";
    document.getElementById("confirmarSenhaBox").style.display = "none";

    document.querySelector(".editar").style.display="block";
    document.querySelector(".salvar").style.display="none";

    Swal.fire({
        icon: "success",
        title: "Sucesso!",
        text: "Seus dados foram atualizados com sucesso.",
        confirmButtonColor: "#1565c0",
        background: "#ffffff",
        color: "#0c2744",
        iconColor: "#28a745",
        confirmButtonText: "Continuar"
    });
}
</script>

<script src="assets/js/acessibilidade.js"></script>

</body>
</html>
