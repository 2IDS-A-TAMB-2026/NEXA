<!--<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>NEXA | Histórico</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f8;
            display: flex;
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 240px;
            background: #0f2a44;
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            /* Elementos em coluna */
            justify-content: space-between;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .sidebar a {
            display: block;
            color: #fff;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #0d58a2;
        }

        .menu-footer {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .menu-footer img {
            width: 120px;
            opacity: 0.85;
            border-radius: 100%;
        }

        /* ===== MAIN ===== */
        .main {
            flex: 1;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: #0f2a44;
        }

        /* ===== FILTROS ===== */
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            align-items: end;
        }

        .filters input,
        .filters select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        /* ===== BOTÃO ANIMADO (PADRÃO NEXA) ===== */
        .filter-btn {
            --color: #0a66c2;
            font-family: inherit;
            width: 180px;
            height: 44px;
            line-height: 42px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: var(--color);
            background: transparent;
            border: 2px solid var(--color);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            z-index: 1;
            transition: color 0.3s ease;
        }

        .filter-btn::before {
            content: "";
            position: absolute;
            background: var(--color);
            width: 220px;
            height: 220px;
            border-radius: 50%;
            top: 100%;
            left: 100%;
            z-index: -1;
            transition: 0.4s ease;
        }

        .filter-btn:hover {
            color: #fff;
        }

        .filter-btn:hover::before {
            top: -60px;
            left: -60px;
        }

        /* ===== TABELA ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }

        th,
        td {
            padding: 12px;
            text-align: left;
        }

        th {
            background: #e9eef3;
        }

        tr:nth-child(even) {
            background: #f9fafb;
        }

        .status-ok {
            color: green;
            font-weight: bold;
        }

        .status-alert {
            color: red;
            font-weight: bold;
        }

        /*footer {APELIDO MUDADO
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }*/
    </style>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <aside class="sidebar">

        <div>
            <h2>NEXA</h2>

            <a href="dashboard.html">Dashboard</a>
            <a href="dashboard_cameras.html" id="menuCameras">
                Dashboard de Câmeras
            </a>
            <a href="upload.html">Análise de EPI</a>
            <a href="history.html" id="menu-history">Histórico</a>

            
            <a href="reports.html" id="menu-reports">Relatórios</a>
            <a href="users.html" id="menu-users">Usuários</a>

            <a href="profile.html">Perfil</a>
            <a href="#" onclick="logout()">Sair</a>
        </div>

        <div class="menu-footer">
            <img src="assets/images/logo-nexa.png" alt="Logo NEXA">
        </div>

    </aside>

    
    <div class="main">
        <header>
            <h1>Histórico de Ocorrências</h1>
        </header>

        
        <section class="filters">
            <input type="date">
            <select>
                <option>Todos os locais</option>
                <option>Área A</option>
                <option>Área B</option>
                <option>Área C</option>
            </select>
            <select>
                <option>Todos EPIs</option>
                <option>Capacete</option>
                <option>Luvas</option>
            </select>

            
            <button class="filter-btn">Filtrar</button>
        </section>

        
        <table>
            <tr>
                <th>Data / Hora</th>
                <th>Local</th>
                <th>EPIs Ausentes</th>
                <th>Status</th>
            </tr>

            <tr>
                <td>03/02/2026 14:32</td>
                <td>Área A</td>
                <td>Capacete</td>
                <td class="status-alert">Irregular</td>
            </tr>

            <tr>
                <td>03/02/2026 13:10</td>
                <td>Área B</td>
                <td>-</td>
                <td class="status-ok">Conforme</td>

            </tr>

            <tr>
                <td>02/02/2026 16:45</td>
                <td>Área C</td>
                <td>Luvas</td>
                <td class="status-alert">Irregular</td>

            </tr>
        </table>

        <footer class="footerweb">
            © 2026 – NEXA | Segurança no centro
        </footer>
    </div>
    <script src="assets/js/permissions.js"></script>

    <script>
        function logout() {
            localStorage.removeItem("tipoUsuario");
            window.location.href = "login.html";
        }

        // Nome dinâmico no topo
        document.addEventListener("DOMContentLoaded", function () {
            const tipo = localStorage.getItem("tipoUsuario");
            const span = document.getElementById("boasVindas");

            if (span && tipo) {
                if (tipo === "admin") {
                    span.innerText = "Bem-vindo, Administrador";
                } else {
                    span.innerText = "Bem-vindo, Funcionário";
                }
            }
        });
    </script>

</body>

</html>
