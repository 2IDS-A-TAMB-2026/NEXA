/* SIDEBAR */
.sidebar {
    width: 270px;
    background: #0f2a44;
    color: #fff;

    position: fixed; /* 🔥 fixa */
    top: 0;
    left: 0;

}



.sidebar h1 {

}

.sidebar a {

.sidebar a:hover {

.sidebar-logo {

}

.menu {
    display: flex;
    flex-direction: column;
    padding: 8px 12px; /* ↓ antes 25px 18px */
    flex: 1;
    gap: 4px; /* ↓ antes 14px */
}

/* ITENS DO MENU */
.menu a {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 9px 11px; /* ↓ antes 16px 18px */
    border-radius: 12px;

    color: #cbd5e1;
    text-decoration: none;

    transition: 0.2s;
    font-size: 15px; /* ↓ leve ajuste */
}
.menu i {
    font-size: 15px; /* ↓ antes 18px */
    width: 18px;
    text-align: center;
}

/* HOVER MAIS LEVE */
.menu a:hover {
    background: #0a66c2;
    color: #fff;
    transform: translateX(3px);
}


.menu a.active {
    background: #0a66c2;
    color: #fff;
    font-weight: bold;
    border-left: 4px solid #19aaed; /* detalhe visual moderno */
}

.menu a.active i {
    color: #fff;
}
/* SAIR */
.logout-item {

    display: flex;

/* LOGO DO SAIR */

/* CARD */

    padding:40px;

}

/* TITULO */

/* SUBTITULO */
.subtitle{
    color:#1565c0;
    font-size:20px;

    margin-bottom:15px;
}

/* GRID */
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

/* INPUT */
.input-box{
    background:#e6e6e6;
    border-radius:15px;
    display:flex;
    align-items:center;
    padding:15px;
}

.input-box i{
    color:#1565c0;
    margin-right:10px;
}

.input-box input{
    border:none;
    background:transparent;
    outline:none;
    width:100%;
}

/* FULL */
.full{

}

/* BOTÃO */
.btn{

    width:260px;

    border:none;

<!-- CONTEÚDO -->
<div class="overlay">

    <div class="card">

        <h1>Perfil do Administrador</h1>

        <div class="subtitle">Informações pessoais</div>

        <div class="form-grid">

            <div class="input-box full">
                <i class="fas fa-user"></i>
                <input type="text" value="Admin NEXA" disabled>
            </div>

            <div class="input-box">
                <i class="fas fa-envelope"></i>
                <input type="email" value="admin@nexa.com" disabled>
            </div>

            <div class="input-box">
                <i class="fas fa-id-card"></i>
                <input type="text" value="000.000.000-00" disabled>
            </div>

            <div class="input-box">
                <i class="fas fa-calendar"></i>
                <input type="date" value="1990-01-01" disabled>
            </div>

            <div class="input-box">
                <i class="fas fa-phone"></i>
                <input type="text" id="telefone" value="(19) 99999-9999" disabled oninput="maskTelefone(this)">
            </div>

        </div>

        <div class="subtitle" style="margin-top:25px;">Segurança</div>

        <div class="form-grid">

            <div class="input-box">
                <i class="fas fa-lock"></i>
                <input type="password" value="123456" disabled>
            </div>

            <div class="input-box">
                <i class="fas fa-lock"></i>
                <input type="password" value="123456" disabled>
            </div>

        </div>

        <button class="btn editar" onclick="editar()">
            <i class="fas fa-edit"></i> Editar
        </button>

        <button class="btn salvar" onclick="salvar()">
            <i class="fas fa-save"></i> Salvar
        </button>

    </div>

</div>

<script>
function editar(){
    document.querySelectorAll("input").forEach(i => i.disabled = false);
    document.querySelector(".editar").style.display = "none";
    document.querySelector(".salvar").style.display = "block";
}

function salvar(){
    document.querySelectorAll("input").forEach(i => i.disabled = true);
    document.querySelector(".editar").style.display = "block";
    document.querySelector(".salvar").style.display = "none";
    alert("Perfil atualizado!");
}
</script>
 <script>
        function logout() {
            localStorage.removeItem("tipoUsuario");
            window.location.href = "login_adm.html";
        }

        function maskTelefone(input){
    let v = input.value.replace(/\D/g,"");

    // limita tamanho (11 dígitos)
    v = v.slice(0,11);

    if(v.length <= 10){
        // telefone fixo (10 dígitos)
        v = v.replace(/^(\d{2})(\d)/g,"($1) $2");
        v = v.replace(/(\d{4})(\d)/,"$1-$2");
    } else {
        // celular (11 dígitos)
        v = v.replace(/^(\d{2})(\d)/g,"($1) $2");
        v = v.replace(/(\d{5})(\d)/,"$1-$2");
    }

    input.value = v;
}
    </script>
