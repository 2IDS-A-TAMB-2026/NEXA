<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>NEXA | Recuperar Senha</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="assets/css/acessibilidade.css">

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/acessibilidade_login.css">

<!-- ICONES -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root {
    --primary: #0a66c2;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

/* ===== BODY ===== */
.body_login{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:80px;
    padding:60px;
    min-height:100vh;
    background: linear-gradient(135deg,#0A66C2,#004182,#002B5B);
}

/* ===== LOGO ===== */
.lado-esquerdo{
    width:45%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.logo-esquerda{
    width:220px;
    opacity:0.95;
    transition:0.4s;
}

.logo-esquerda:hover{
    transform:scale(1.05);
}

/* ===== CARD ===== */
.container{
    background:#fff;
    padding:35px;
    border-radius:20px;
    width:420px;
    box-shadow:0 25px 60px rgba(0,0,0,0.25);
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#1f3c5b;
}

p{
    text-align:center;
    font-size:14px;
    color:#555;
    margin-bottom:20px;
}

/* INPUT */
.input-box{
    display:flex;
    align-items:center;
    padding:12px;
    margin-bottom:15px;
    background:#fff;
    border-radius:12px;
    box-shadow: inset 0 0 0 1px #b4b4b4;
}

.input-box i{
    margin-right:10px;
    color:#0a66c2;
}

.input-box input{
    border:none;
    outline:none;
    width:100%;
    background:transparent;
}

/* BOTÃO */
.btn{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:none;
    background: linear-gradient(135deg,#0A66C2,#003c8f);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

/* MENSAGENS */
.error{
    display:none;
    color:red;
    text-align:center;
    font-size:14px;
    margin-top:10px;
}

.success{
    display:none;
    color:green;
    text-align:center;
    font-size:14px;
    margin-top:10px;
}

a{
    display:block;
    text-align:center;
    margin-top:15px;
    font-size:14px;
    color:var(--primary);
    text-decoration:none;
}

.logo-esquerda {
    width: 14em;
}
.login-container {
    width: 100%;
    max-width: 420px;
}

.login-container {
    padding: 2.2em;
    border-radius: 1.2em;
}

.titulo-login {
    font-size: 1.8em;
}

.input-box {
    padding: 0.9em;
    border-radius: 0.8em;
}

.input-box input {
    font-size: 1em;
}

.btn-entrar {
    padding: 1em;
    font-size: 1em;
    border-radius: 0.8em;
}
/* RESPONSIVO */
@media (max-width:768px){
    .body_login{
        flex-direction:column;
        gap:40px;
        padding:30px;
    }

    .lado-esquerdo{
        width:100%;
    }

    .container{
        width:100%;
    }
}
</style>
</head>

<body class="body_login">

    
        <!-- 🔹 MENU ACESSIBILIDADE -->
      <div class="access-bar">

    <button class="access-btn" onclick="Acessibilidade.toggleContraste()">
        <i class="fas fa-adjust"></i>
    </button>

     <button class="access-btn" onclick="toggleDark()">
            <i class="fas fa-moon"></i>
        </button>

    <button class="access-btn" onclick="Acessibilidade.aumentarFonte()">
         A+
    </button>

    <button class="access-btn" onclick="Acessibilidade.diminuirFonte()">
        A-
    </button>

    <button class="access-btn" onclick="Acessibilidade.lerPagina()">
        <i class="fas fa-volume-up"></i>
    </button>

</div>

<!-- LOGO -->
<div class="lado-esquerdo">
    <img src="assets/images/logo_escura_transparente.png" class="logo-esquerda">
</div>

<!-- CARD -->
<div class="container">

    <h2>Recuperar Senha</h2>
    <p>Digite seu e-mail para continuar</p>

    <div class="input-box">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="Seu e-mail">
    </div>

    <button class="btn" onclick="recuperar()">Continuar</button>

    <div class="error" id="erro">E-mail não encontrado</div>
    <div class="success" id="sucesso">Redirecionando...</div>

    <a href="login.html">Voltar para o login</a>

</div>

<script>
function recuperar(){
    const email = document.getElementById("email").value;
    const erro = document.getElementById("erro");
    const sucesso = document.getElementById("sucesso");

    erro.style.display = "none";
    sucesso.style.display = "none";

    if(!email){
        erro.innerText = "Digite um e-mail";
        erro.style.display = "block";
        return;
    }

    if(email === "admin@nexa.com" || email === "funci@nexa.com"){
        sucesso.style.display = "block";

        setTimeout(()=>{
            window.location.href = "nova_senha.html";
        },1500);
    } else {
        erro.innerText = "E-mail não encontrado";
        erro.style.display = "block";
    }
}
</script>
<script src="assets/js/acessibilidade.js"></script>

</body>
</html>
