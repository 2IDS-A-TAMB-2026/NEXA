<!-- NOME -->
    <div class="input-box">

<input id="email" type="email" placeholder="E-mail corporativo">

 </div>

<input id="rfid" type="text" placeholder="UID RFID">

<input id="cnpj" type="text" placeholder="CNPJ Empresa" oninput="maskCNPJ(this)">

            <i class="fas fa-plus"></i> Cadastrar

<div class="list-box">
    <h2><i class="fas fa-users"></i> Funcionários cadastrados</h2>

    </div>

<script>
let funcionarios = [];
let editIndex = null;

/* ================= VALIDAR ================= */
function setError(input, msg){
    const parent = input.parentElement;
    parent.classList.add("error");

    let erro = parent.querySelector(".error-text");
    if(erro) erro.remove();

    const div = document.createElement("div");
    div.className = "error-text";
    div.innerText = msg;

    parent.appendChild(div);
}

function clearError(input){
    const parent = input.parentElement;
    parent.classList.remove("error");

    let erro = parent.querySelector(".error-text");
    if(erro) erro.remove();
}

function validar(){
    let ok = true;

    const nome = document.getElementById("nome");
    const cpf = document.getElementById("cpf");
    const email = document.getElementById("email");
    const telefone = document.getElementById("telefone");
    const senha = document.getElementById("senha");
    const confirmSenha = document.getElementById("confirmSenha");

    const inputs = document.querySelectorAll(".form-grid input");

    inputs.forEach(i => clearError(i));

    /* OBRIGATORIOS */
    inputs.forEach(i=>{
        if(!i.value){
            setError(i, "Campo obrigatório");
            ok = false;
        }
    });

    /* EMAIL */
    if(email.value && !email.value.includes("@")){
        setError(email,"Email inválido");
        ok = false;
    }

    /* TELEFONE */
    if(telefone.value.length < 14){
        setError(telefone,"Telefone inválido");
        ok = false;
    }

    /* SENHA */
    if(senha.value !== confirmSenha.value){
        setError(confirmSenha,"Senhas não coincidem");
        ok = false;
    }


    if(cpf.value.replace(/\D/g,"").length !== 11){
   
    ok = false;
}


const cnpj = document.getElementById("cnpj");

if(cnpj.value.length < 18){
    
    ok = false;
}

    return ok;
}

/* ================= CADASTRAR ================= */
function cadastrarFuncionario(){

    if(!validar()) return;

    const funcionario = {
        nome: nome.value,
        cpf: cpf.value,
        nascimento: nascimento.value,
        email: email.value,
        telefone: telefone.value,
        rfid: rfid.value,
        cnpj: cnpj.value,
        setor: setor.value
    };

    if(editIndex !== null){
        funcionarios[editIndex] = funcionario;
        editIndex = null;
    } else {
        funcionarios.push(funcionario);
    }

    limpar();
    renderizarFuncionarios();
}

/* ================= LIMPAR ================= */
function limpar(){
    document.querySelectorAll(".form-grid input").forEach(i=> i.value="");
}

/* ================= LISTAR ================= */
function renderizarFuncionarios(){
    const lista = document.getElementById("listaFuncionarios");

    if(funcionarios.length === 0){
        lista.innerHTML = "<p style='text-align:center; color:#888;'>Nenhum funcionário cadastrado</p>";
        return;
    }

    lista.innerHTML = "";

    funcionarios.forEach((f,i)=>{
        lista.innerHTML += `
        <div class="funcionario-card">

            <div class="func-info">

                <span><strong>Nome:</strong> ${f.nome}</span>
                <span><strong>CPF:</strong> ${f.cpf}</span>

                <span><strong>Nascimento:</strong> ${f.nascimento}</span>
                <span><strong>Email:</strong> ${f.email}</span>

                <span><strong>Telefone:</strong> ${f.telefone}</span>
                <span><strong>RFID:</strong> ${f.rfid}</span>

                <span><strong>CNPJ:</strong> ${f.cnpj}</span>
                <span><strong>Setor:</strong> ${f.setor}</span>

            </div>

            <div class="func-actions">
                <i class="fas fa-pen edit" onclick="editar(${i})"></i>
                <i class="fas fa-trash delete" onclick="remover(${i})"></i>
            </div>

        </div>
        `;
    });
}

/* ================= REMOVER ================= */
function remover(i){
    funcionarios.splice(i,1);
    renderizarFuncionarios();
}

/* ================= EDITAR ================= */
function editar(i){
    const f = funcionarios[i];

    document.getElementById("nome").value = f.nome;
    document.getElementById("cpf").value = f.cpf;
    document.getElementById("nascimento").value = f.nascimento;
    document.getElementById("email").value = f.email;
    document.getElementById("telefone").value = f.telefone;
    document.getElementById("rfid").value = f.rfid;
    document.getElementById("cnpj").value = f.cnpj;
    document.getElementById("setor").value = f.setor;

    editIndex = i;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

/* ================= MÁSCARAS ================= */


function maskCNPJ(input){
        let v = input.value.replace(/\D/g,"").slice(0,14);

    v = v.replace(/^(\d{2})(\d)/, "$1.$2");
    v = v.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
    v = v.replace(/\.(\d{3})(\d)/, ".$1/$2");
    v = v.replace(/(\d{4})(\d)/, "$1-$2");

    input.value = v;
}
function maskCPF(input){
    let v = input.value.replace(/\D/g,"").slice(0,11); // 🔥 limita 11

    v = v.replace(/(\d{3})(\d)/,"$1.$2");
    v = v.replace(/(\d{3})(\d)/,"$1.$2");
    v = v.replace(/(\d{3})(\d{1,2})$/,"$1-$2");

    input.value = v;
}

function maskTel(input){
    let v = input.value.replace(/\D/g,"").slice(0,11); // 🔥 limita 11

    if(v.length > 10){
        v = v.replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3");
    } else {
        v = v.replace(/(\d{2})(\d{4})(\d{4})/, "($1) $2-$3");
    }

    input.value = v;
}
        function validarNome(input){
    input.value = input.value.replace(/[0-9]/g,"");
}
 </script>
