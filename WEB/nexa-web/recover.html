<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>NEXA | Recuperar Senha</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2a44, #0a66c2);
        }

        .box {
            background: #fff;
            width: 340px;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .2);
        }

        h1 {
            color: #0f2a44;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0a66c2;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #084c93;
        }

        .msg {
            display: none;
            margin-top: 15px;
            font-size: 13px;
            color: green;
        }

        a {
            display: block;
            margin-top: 20px;
            font-size: 13px;
            color: #0a66c2;
            text-decoration: none;
        }
    </style>
</head>

<body class="body_login">

    <div class="box">

        <h1>Recuperar Senha</h1>
        <p>Digite seu e-mail para redefinir sua senha.</p>

        <input type="email" id="email" placeholder="Seu e-mail">

        <button onclick="recuperar()">Enviar</button>

        <div class="msg" id="mensagem">
            Se o e-mail existir, enviaremos as instruções.
        </div>

        <a href="login.html">Voltar para o login</a>

    </div>

    <script>
        function recuperar() {

            let email = document.getElementById("email").value;
            let msg = document.getElementById("mensagem");

            if (email === "") {
                alert("Digite um e-mail válido!");
                return;
            }

            msg.style.display = "block";
        }
    </script>


</body>

</html>
