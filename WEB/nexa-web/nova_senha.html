<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>NEXA | Nova Senha</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="assets/css/acessibilidade.css">
    <link rel="stylesheet" href="assets/css/acessibilidade_login.css">

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- ICONES -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary: #0a66c2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 80px;
            padding: 60px;
            min-height: 100vh;
            background: linear-gradient(135deg, #0A66C2, #004182, #002B5B);
        }

        /* LOGO */
        .lado-esquerdo {
            width: 45%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            width: 220px;
            opacity: 0.95;
            transition: 0.3s;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        /* CARD */
        .container {
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            width: 420px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
        }

        .titulo {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #1f3c5b;
            margin-bottom: 25px;
        }

        /* INPUT */
        .input-box {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 15px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: inset 0 0 0 1px #b4b4b4;
            transition: 0.3s;
        }

        .input-box i {
            margin-right: 10px;
            color: #0a66c2;
        }

        .input-box input {
            border: none;
            outline: none;
            width: 100%;
            background: transparent;
        }

        .input-box:focus-within {
            box-shadow: inset 0 0 0 2px #0a66c2, 0 0 10px rgba(10,102,194,0.2);
            transform: scale(1.02);
        }

        /* BOTÃO */
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #0A66C2, #003c8f);
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* ERRO */
        .error {
            margin-top: 10px;
            color: red;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
        }

        /* RESPONSIVO */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                gap: 40px;
                padding: 30px;
            }

            .lado-esquerdo {
                width: 100%;
            }

            .container {
                width: 100%;
            }
        }

        .input-box.error {
    border: 2px solid #e53935;
}

.error-text {
    color: #e53935;
    font-size: 13px;
    margin-top: -8px;
    margin-bottom: 10px;
    padding-left: 10px;
}


.logo-esquerda {
    width: 14em;
}

.login-container {
    width: 100%;
    max-width: 420px;
}
.login-container {
    padding: 2.2em;
    border-radius: 1.2em;
}

.titulo-login {
    font-size: 1.8em;
}

.input-box {
    padding: 0.9em;
    border-radius: 0.8em;
}

.input-box input {
    font-size: 1em;
}

.btn-entrar {
    padding: 1em;
    font-size: 1em;
    border-radius: 0.8em;
}
    </style>
</head>

<body class="body_login">
    
        <!-- 🔹 MENU ACESSIBILIDADE -->
      <div class="access-bar">

    <button class="access-btn" onclick="Acessibilidade.toggleContraste()">
        <i class="fas fa-adjust"></i>
    </button>

     <button class="access-btn" onclick="toggleDark()">
            <i class="fas fa-moon"></i>
        </button>

    <button class="access-btn" onclick="Acessibilidade.aumentarFonte()">
         A+
    </button>

    <button class="access-btn" onclick="Acessibilidade.diminuirFonte()">
        A-
    </button>

    <button class="access-btn" onclick="Acessibilidade.lerPagina()">
        <i class="fas fa-volume-up"></i>
    </button>

</div>

    <!-- LOGO -->
    <div class="lado-esquerdo">
        <img src="assets/images/logo_escura_transparente.png" class="logo">
    </div>

    <!-- CARD -->
    <div class="container">

        <h2 class="titulo">Criar Nova Senha</h2>

        <div class="form-group">
    <div class="input-box">
        <i class="fas fa-lock"></i>
        <input type="password" id="senha" placeholder="Nova senha" oninput="clearError(this)">
    </div>
    <div class="error-text"></div>
</div>

<div class="form-group">
    <div class="input-box">
        <i class="fas fa-lock"></i>
        <input type="password" id="confirmar" placeholder="Confirmar senha" oninput="clearError(this)">
    </div>
    <div class="error-text"></div>
</div>

        <button class="btn" onclick="salvarSenha()">Salvar Nova Senha</button>

        <div class="error" id="erro">
            As senhas não coincidem!
        </div>

        <footer>
            <a href="login.html">Voltar para login</a><br>
            <p>© 2026 – NEXA</p>
        </footer>

    </div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
function salvarSenha(){
    const senha = document.getElementById("senha").value;
    const confirmar = document.getElementById("confirmar").value;

    if(senha === "" || confirmar === ""){
        Swal.fire({
            icon: "warning",
            title: "Campos vazios",
            text: "Preencha os dois campos para continuar.",
            confirmButtonColor: "#0a66c2"
        });
        return;
    }

    if(senha.length < 8){
        Swal.fire({
            icon: "error",
            title: "Senha muito curta",
            text: "A senha deve ter no mínimo 8 caracteres.",
            confirmButtonColor: "#0a66c2"
        });
        return;
    }

    if(senha !== confirmar){
        Swal.fire({
            icon: "error",
            title: "Erro",
            text: "As senhas não coincidem.",
            confirmButtonColor: "#0a66c2"
        });
        return;
    }

    Swal.fire({
        icon: "success",
        title: "Senha atualizada!",
        text: "Sua senha foi redefinida com sucesso.",
        confirmButtonColor: "#0a66c2"
    }).then(() => {
        window.location.href = "login.html";
    });
}
</script>
<script src="assets/js/acessibilidade.js"></script>

</body>

</html>
