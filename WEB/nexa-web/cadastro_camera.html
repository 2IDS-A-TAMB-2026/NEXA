      <script>
let cameras = [];
let editIndex = null;

/* ================= RENDER ================= */
function renderizar() {
    const lista = document.getElementById('lista');

    if (cameras.length === 0) {
        lista.innerHTML = `<p id="mensagemVazia">Nenhuma câmera registrada :(</p>`;
        return;
    }

    lista.innerHTML = '';

    cameras.forEach((cam, index) => {
        lista.innerHTML += `
        <div class="lista-card">
            <div class="lista-left">
                <i class="fas fa-video"></i>
                <div class="lista-info">
                    <h3>${cam.nome}</h3>
                    <p>ID Setor: ${cam.idSetor}</p>
                    <p>CNPJ: ${cam.cnpj}</p>
                    <p>Status: ${cam.status}</p>
                </div>
            </div>
            <div class="lista-actions">
                <i class="fas fa-pen edit" onclick="editar(${index})"></i>
                <i class="fas fa-trash delete" onclick="excluir(${index})"></i>
            </div>
        </div>`;
    });
}

/* ================= CADASTRAR ================= */
function cadastrar() {
    const nome = document.getElementById('nome');
    const idSetor = document.getElementById('idSetor');
    const cnpj = document.getElementById('cnpj');
    const status = document.getElementById('status');

    let ok = true;

    [nome, idSetor, cnpj, status].forEach(i => clearError(i));

    if (!validarObrigatorio(nome)) ok = false;
    if (!validarObrigatorio(idSetor)) ok = false;

    if (!validarObrigatorio(cnpj)) {
        ok = false;
    } else if (!validarCNPJ(cnpj.value)) {
        setError(cnpj, "CNPJ inválido");
        ok = false;
    }

    if (!validarObrigatorio(status)) ok = false;

    if (!ok) return;

    cameras.push({
        nome: nome.value,
        idSetor: idSetor.value,
        cnpj: cnpj.value,
        status: status.value
    });

    renderizar();

    nome.value = '';
    idSetor.value = '';
    cnpj.value = '';
    status.value = '';
}

/* ================= EDITAR ================= */

function editar(index){
    editIndex = index;

    const cam = cameras[index];

    document.getElementById('editNome').value = cam.nome;
    document.getElementById('editIdSetor').value = cam.idSetor;
    document.getElementById('editCnpj').value = cam.cnpj;
    document.getElementById('editStatus').value = cam.status;

    document.getElementById('modalBg').style.display = 'flex';
}
/* ================= SALVAR ================= */
function salvarEdicao(){
    const nome = document.getElementById('editNome');
    const idSetor = document.getElementById('editIdSetor');
    const cnpj = document.getElementById('editCnpj');
    const status = document.getElementById('editStatus');

    let ok = true;

    [nome, idSetor, cnpj, status].forEach(clearError);

    if(!validarObrigatorio(nome)) ok = false;
    if(!validarObrigatorio(idSetor)) ok = false;

    if(!validarObrigatorio(cnpj)){
        ok = false;
    } else if(!validarCNPJ(cnpj.value)){
        setError(cnpj, "CNPJ inválido");
        ok = false;
    }

    if(!validarObrigatorio(status)) ok = false;

    if(!ok) return;

    cameras[editIndex] = {
        nome: nome.value,
        idSetor: idSetor.value,
        cnpj: cnpj.value,
        status: status.value
    };

    renderizar();
    fecharModal();
}

/* ================= EXCLUIR ================= */
function excluir(index) {
    Swal.fire({
        title: "Excluir câmera?",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Sim",
        cancelButtonText: "Não"
    }).then((result) => {
        if (result.isConfirmed) {
            cameras.splice(index, 1);
            renderizar();
        }
    });
}

/* ================= MODAL ================= */
function fecharModal() {
    document.getElementById('modalBg').style.display = 'none';
}

/* ================= VALIDAÇÕES ================= */
function validarObrigatorio(input, msg = "Campo obrigatório") {
    if (!input.value || !input.value.trim()) {
        setError(input, msg);
        return false;
    }
    return true;
}

function setError(input, msg) {
    const group = input.closest(".form-group");
    const box = group.querySelector(".input-box");
    const erro = group.querySelector(".error-text");

    box.classList.add("error");
    erro.innerText = msg;
}

function clearError(input) {
    const group = input.closest(".form-group");
    const box = group.querySelector(".input-box");
    const erro = group.querySelector(".error-text");

    box.classList.remove("error");
    erro.innerText = "";
}

/* ================= CNPJ ================= */
function maskCNPJ(input) {
    let v = input.value.replace(/\D/g, "").slice(0, 14);

    v = v.replace(/^(\d{2})(\d)/, "$1.$2");
    v = v.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
    v = v.replace(/\.(\d{3})(\d)/, ".$1/$2");
    v = v.replace(/(\d{4})(\d)/, "$1-$2");

    input.value = v;
}

function validarCNPJ(cnpj) {
    cnpj = cnpj.replace(/[^\d]+/g, '');

    if (cnpj.length !== 14) return false;
    if (/^(\d)\1+$/.test(cnpj)) return false;

    let tamanho = cnpj.length - 2;
    let numeros = cnpj.substring(0, tamanho);
    let digitos = cnpj.substring(tamanho);

    let soma = 0;
    let pos = tamanho - 7;

    for (let i = tamanho; i >= 1; i--) {
        soma += numeros.charAt(tamanho - i) * pos--;
        if (pos < 2) pos = 9;
    }

    let resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;
    if (resultado != digitos.charAt(0)) return false;

    tamanho = tamanho + 1;
    numeros = cnpj.substring(0, tamanho);

    soma = 0;
    pos = tamanho - 7;

    for (let i = tamanho; i >= 1; i--) {
        soma += numeros.charAt(tamanho - i) * pos--;
        if (pos < 2) pos = 9;
    }

    resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;

    return resultado == digitos.charAt(1);
}
