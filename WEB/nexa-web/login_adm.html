<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>NEXA | Administrador -- Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/acessibilidade.css">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/acessibilidade_login.css">

<style>
    :root {
            --primary: #0a66c2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* ===== BODY ===== */
        .body_login {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 80px;
            padding: 60px;
            min-height: 100vh;
            background: linear-gradient(135deg, #0A66C2, #004182, #002B5B);
        }

  
        /* ===== LOGO ===== */
        .lado-esquerdo {
            width: 45%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: slideLeft 1s ease;
        }

        .logo-esquerda {
            width: 220px;
            opacity: 0.95;
            transition: 0.4s;
        }

        .logo-esquerda:hover {
            transform: scale(1.05);
        }

        .logo-dark {
            display: none;
        }

        body.dark .logo-light {
            display: none;
        }

        body.dark .logo-dark {
            display: block;
        }

        /* ===== CARD LOGIN ===== */
        .login-container {
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            width: 420px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
            animation: slideRight 1s ease;
        }

        .titulo-login {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #1f3c5b;
            margin-bottom: 25px;
        }

        /* ===== INPUT ===== */
        .input-box {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 15px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: inset 0 0 0 1px #b4b4b4;
            transition: 0.3s;
        }

        .input-box input {
            border: none;
            outline: none;
            width: 100%;
            background: transparent;
        }

        .input-box:focus-within {
            box-shadow: inset 0 0 0 2px #0a66c2, 0 0 10px rgba(10,102,194,0.2);
            transform: scale(1.02);
        }

        /* ===== BOTÃO ===== */
        .btn-entrar {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #0A66C2, #003c8f);
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-entrar:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* ===== LINKS ===== */
        .links {
            margin-top: 15px;
            text-align: center;
        }

        .links a {
            display: block;
            font-size: 14px;
            color: var(--primary);
            text-decoration: none;
            margin-top: 8px;
        }

        /* ===== ERRO ===== */
        .error {
            margin-top: 10px;
            color: red;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        /* ===== FOOTER ===== */
        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }

        #voltar {
            color: var(--primary);
            text-decoration: none;
        }

        /* ===== DARK MODE ===== */
        body.dark {
            background: #0f172a;
            color: #fff;
        }

        body.dark .login-container {
            background: #1e293b;
            color: #fff;
        }

        body.dark .input-box {
            background: #0f172a;
            box-shadow: inset 0 0 0 1px #334155;
        }

        /* ===== CONTRASTE ===== */
        body.contraste {
            filter: contrast(1.4);
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 768px) {
            .body_login {
                flex-direction: column;
                gap: 40px;
                padding: 30px;
            }

            .lado-esquerdo {
                width: 100%;
            }

            .login-container {
                width: 100%;
            }
        }

        
.logo-esquerda {
    width: 14em;
}

.login-container {
    width: 100%;
    max-width: 420px;
}
.login-container {
    padding: 2.2em;
    border-radius: 1.2em;
}

.titulo-login {
    font-size: 1.8em;
}

.input-box {
    padding: 0.9em;
    border-radius: 0.8em;
}

.input-box input {
    font-size: 1em;
}

.btn-entrar {
    padding: 1em;
    font-size: 1em;
    border-radius: 0.8em;
}
    </style>
</head>


<body class="body_login">

   <!-- ACESSIBILIDADE -->
    <div class="access-bar">
        <button class="access-btn" onclick="Acessibilidade.toggleContraste()">
            <i class="fas fa-adjust"></i>
        </button>

        <button class="access-btn" onclick="toggleDark()">
            <i class="fas fa-moon"></i>
        </button>

        <button class="access-btn" onclick="Acessibilidade.aumentarFonte()">A+</button>
        <button class="access-btn" onclick="Acessibilidade.diminuirFonte()">A-</button>

        <button class="access-btn" onclick="Acessibilidade.lerPagina()">
            <i class="fas fa-volume-up"></i>
        </button>
    </div>
    <!-- LOGO -->
    <div class="lado-esquerdo">
        <img src="assets/images/logo_escura_transparente.png" class="logo-esquerda logo-light">
        <img src="assets/images/logo_escura_transparente.png" class="logo-esquerda logo-dark">
    </div>


    <!-- LOGIN -->
    <div class="login-container">

        <h2 class="titulo-login">Login</h2>
        <h6><i>Administrador</i></h6>

        <form id="loginForm">
            <div class="input-box">
                <input type="email" id="email" placeholder="Email">
            </div>

            <div class="input-box">
                <input type="password" id="senha" placeholder="Senha">
            </div>

            <button type="submit" class="btn-entrar">Entrar</button>
        </form>

        <div class="error" id="errorMsg">
            E-mail ou senha inválidos
        </div>

        <div class="links">
            <a href="recover.html">Esqueci minha senha</a>
        </div>

        <footer>
            <p>© 2026 – NEXA</p>
            <a href="index.html" id="voltar">Voltar para a página inicial</a>
        </footer>

    </div>

    <!-- JS ORIGINAL (mantido) -->
    <script>
        alert('SENHA: nexa2026');
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const errorMsg = document.getElementById("errorMsg");

            errorMsg.style.display = "none";

            if (email === "admin@nexa.com" && senha === "nexa2026") {
                window.location.href = "dashboard.html";
            } else {
                errorMsg.style.display = "block";
            }
        });
    </script>
     <script src="assets/js/acessibilidade.js"></script>

</body>
</html>
