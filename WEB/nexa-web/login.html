<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>NEXA | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0a66c2;
            
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* ===== CONTAINER ===== */
        .login-container {
            background: #fff;
            width: 100%;
            max-width: 380px;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .25);
        }


        /* ===== FORM ===== */
        form label {
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-top: 15px;
        }

        form input {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            outline: none;
        }

        form input:focus {
            border-color: var(--primary);
        }

        /* ===== AÇÕES ===== */
        .actions-inline {
            margin-top: 28px;
            display: flex;
            gap: 15px;
        }

        /* ===== BOTÃO BASE ANIMADO ===== */
        .button2 {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;

            transition: all 0.2s ease-in;
            position: relative;
            overflow: hidden;
            z-index: 1;

            padding: 0.7em 1.7em;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            border-radius: 0.6em;
            text-decoration: none;
            border: 1px solid transparent;
        }

        /* ===== ENTRAR ===== */
        .btn-entrar {
            color: #ffffff;
            background: #0a66c2;
            box-shadow: 6px 6px 12px rgba(10, 102, 194, .35),
                -6px -6px 12px rgba(255, 255, 255, .6);
        }


        /* ===== ACTIVE ===== */
        .button2:active {
            transform: scale(0.96);
        }

        /* ===== EFEITO ONDA ===== */
        .button2:before {
            content: "";
            position: absolute;
            left: 50%;
            transform: translateX(-50%) scaleY(1) scaleX(1.25);
            top: 100%;
            width: 140%;
            height: 180%;
            background-color: rgba(0, 0, 0, 0.05);
            border-radius: 50%;
            transition: all 0.5s 0.1s cubic-bezier(0.55, 0, 0.1, 1);
            z-index: -1;
        }

        .button2:after {
            content: "";
            position: absolute;
            left: 50%;
            transform: translateX(-50%) scaleY(1) scaleX(1.45);
            top: 180%;
            width: 160%;
            height: 190%;
            background-color: var(--primary);
            border-radius: 50%;
            transition: all 0.5s 0.1s cubic-bezier(0.55, 0, 0.1, 1);
            z-index: -1;
        }

        .button2:hover {
            color: #ffffff;
        }

        .button2:hover:before {
            top: -35%;
            background-color: var(--primary);
            transform: translateX(-50%) scaleY(1.3) scaleX(0.8);
        }

        .button2:hover:after {
            top: -45%;
            background-color: var(--primary);
            transform: translateX(-50%) scaleY(1.3) scaleX(0.8);
        }

        /* ===== LINKS ===== */
        .links {
            margin-top: 22px;
            text-align: center;
        }

        .links a {
            text-decoration: none;
            font-size: 14px;
            color: var(--primary);
            display: block;
            margin-top: 8px;
        }

        /* ===== ERRO ===== */
        .error {
            margin-top: 15px;
            /*vai atrapalhar a msg de erro do select?*/
            color: red;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        /* ===== FOOTER ===== */
        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="body_login">

    <div class="login-container">

        <!-- LOGO -->
        <div class="logo-login">
            <img src="assets/images/logo-nexa.png" alt="Logo NEXA" class="logo-img-login">
        </div>

        <!-- FORM -->
        <form id="loginForm">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="exemplo@empresa.com">

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="••••••••">

            <label for="tipo">Perfil</label>
            <select id="tipo">
                <option value="">Selecione</option>
                <option value="admin">Administrador</option>
                <option value="funcionario">Funcionário</option>
            </select>
            <br><span id="erroTipo" class="error"></span>

            <!-- BOTÕES -->
            <div class="actions-inline">
                <button type="submit" class="button2 btn-entrar">Entrar</button>
                <a href="index.html" class="button2 btn-voltar">Home</a>
            </div>
        </form>

        <!-- ERRO -->
        <div class="error" id="errorMsg">
            E-mail ou senha inválidos
        </div>

        <!-- LINKS -->
        <div class="links">
            <a href="recover.html">Esqueci minha senha</a>
            <a href="register.html">Criar conta</a>
        </div>

        <footer class="footerweb">
            © 2026 – NEXA
        </footer>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const tipo = document.getElementById("tipo").value;
            const errorMsg = document.getElementById("errorMsg");
            const erroTipo = document.getElementById('erroTipo');

            errorMsg.style.display = "none";

            // Simulação de login
            if (email === "admin@nexa.com" && senha === "123456" && tipo === "admin") {


                localStorage.setItem("tipoUsuario", "admin");

                window.location.href = "dashboard.html";

            } else if (email === "funci@nexa.com" && senha === "123456" && tipo === "funcionario") {


                localStorage.setItem("tipoUsuario", "funcionario");

                window.location.href = "dashboard.html";

            } else {
                errorMsg.style.display = "block";
            }

            //validação dos campos, email senha tipo
            let validacao = true;

            if (email.value.trim() === '') {
                errorMsg.style.display = 'block';//teste
                email.style.border = '1px solid #d32f2f'//código hexagonal?
                validacao = false;
            } //else? o errormsg só não aparece em caso de preenchimento

            if (senha.value.trim() === '' || senha.value.trim() < 6) {
                errorMsg.style.display = 'block';//teste
                senha.style.border = '1px solid #d32f2f'//código hexagonal?
                validacao = false;
            }

            if (tipo.value == '') {
                erroTipo.innerText = 'Selecione seu cargo';
                tipo.style.border = '1px solid #d32f2f';
                validacao = false;
            } else {
                erroTipo.innerText = '';
            }//o que vai dar errado?*/
        });
    </script>

</body>

</html>
